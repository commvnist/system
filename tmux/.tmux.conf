# Vim-style tmux bindings. Ctrl-h/j/k/l stay available to normal shell tools;
# use prefix+h/j/k/l in tmux and Ctrl-h/j/k/l inside Vim.

# use C-a, since it's on the home row and easier to hit than C-b
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Responsiveness and terminal integration
set -g escape-time 10
set -g focus-events on
set -g history-limit 100000
set -g status-keys vi
set-option -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB:clipboard'

# Easy config reload
bind-key -N "Reload tmux configuration" R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# vi is good
setw -g mode-keys vi

# mouse behavior
setw -g mouse on

bind-key : command-prompt
bind-key r refresh-client

bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

# use vim-like keys for splits and windows
bind-key -N "Split into left and right panes" v split-window -h -c "#{pane_current_path}"
bind-key -N "Split into top and bottom panes" s split-window -v -c "#{pane_current_path}"
bind-key -r -N "Move to left pane" h select-pane -L
bind-key -r -N "Move to lower pane" j select-pane -D
bind-key -r -N "Move to upper pane" k select-pane -U
bind-key -r -N "Move to right pane" l select-pane -R

bind-key C-o rotate-window

bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical

set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80
set-window-option -g display-panes-time 1500
set-window-option -g window-status-current-style fg=magenta

bind-key -N "Return to previous pane" a last-pane
bind-key q display-panes
bind-key -N "Create window in current directory" c new-window -c "#{pane_current_path}"
# Pick an existing session or create one for a directory visited by zoxide.
# Keep the built-in prefix+w tree for browsing windows within sessions.
bind-key -N "Find or create a session" p display-popup -E -w 80% -h 70% -T "Sessions" "sesh picker"
bind-key -N "Return to previous session" L switch-client -l
bind-key -N "Next window" t next-window
bind-key -N "Previous window" T previous-window
bind-key -N "Zoom pane" z resize-pane -Z
bind-key -N "Toggle synchronized panes" S set-window-option synchronize-panes \; display-message "synchronize-panes #{?pane_synchronized,on,off}"

bind-key [ copy-mode
bind-key ] paste-buffer

# Copy to the host through the native OS bridge and OSC 52 when supported.
# Keep external: applications in panes cannot send arbitrary OSC 52 writes.
set -s set-clipboard external
set -s copy-command '$HOME/.local/bin/clipboard-copy'
set -ga update-environment ' WAYLAND_DISPLAY XDG_RUNTIME_DIR'

# Copy mode bindings (vi-style)
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel

# Enter and mouse drag also copy to the tmux buffer and host clipboard.
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Status Bar
set-option -g status-interval 10
set-option -g status-style bg=black
set-option -g status-style fg=white
set -g status-left '#[fg=magenta,bold]#S #[fg=green]#H #[default]'
set -g status-left-length 40
set -g status-right '#[fg=yellow]#{?client_prefix,PREFIX ,}#[fg=cyan]#{?pane_synchronized,sync ,}#[fg=magenta]#{?window_zoomed_flag,zoom ,}#[fg=white]%a %H:%M #[fg=blue]%Y-%m-%d'
set -g status-right-length 80
set -g window-status-format '#[fg=white] #I:#W#F '
set -g window-status-current-format '#[fg=magenta,bold] #I:#W#F '

set-option -g pane-active-border-style fg=yellow
set-option -g pane-border-style fg=cyan
set-option -g display-panes-active-colour yellow
set-option -g display-panes-colour cyan

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# After prefix+h/j/k/l, repeat direction keys briefly without another prefix.
set-option -g repeat-time 400
