name: Check system setup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the native Home Manager generation
        shell: bash
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake check --no-update-lock-file "path:$PWD"
          system=$(nix --extra-experimental-features 'nix-command flakes' eval --raw --impure --expr builtins.currentSystem)
          activation=$(nix --extra-experimental-features 'nix-command flakes' build --no-update-lock-file --no-link --print-out-paths "path:$PWD#checks.$system.activation")
          printf '%s\n' "$activation/home-path/bin" >> "$GITHUB_PATH"
      - name: Check scripts, bindings, and fallbacks
        shell: bash
        run: |
          bash -n bootstrap/*.sh tests/*.sh zsh/.local/bin/zsh-plugin-sync
          zsh -n zsh/.zshrc
          bash tests/test_install_nix.sh
          bash tests/test_home.sh
          python3 bootstrap/sync-plugin-pins.py --check
          python3 -m unittest discover -s tests -p test_config.py
          TERM=xterm-256color STARSHIP_CONFIG="$PWD/starship/.config/starship.toml" starship prompt >/dev/null
          tmux -L system-ci -f "$PWD/tmux/.tmux.conf" new-session -d -s smoke
          tmux -L system-ci kill-server
      - name: Evaluate every supported system
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: nix --extra-experimental-features 'nix-command flakes' flake check --no-update-lock-file --all-systems --no-build "path:$PWD"
      - name: Lint scripts and workflow
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          actionlint_path=$(nix --extra-experimental-features 'nix-command flakes' build --impure --no-link --print-out-paths --expr "let f = builtins.getFlake \"path:$PWD\"; in f.inputs.nixpkgs.legacyPackages.x86_64-linux.actionlint")
          shellcheck_path=$(nix --extra-experimental-features 'nix-command flakes' build --impure --no-link --print-out-paths --expr "let f = builtins.getFlake \"path:$PWD\"; in f.inputs.nixpkgs.legacyPackages.x86_64-linux.shellcheck")
          "$shellcheck_path/bin/shellcheck" bootstrap/*.sh tests/*.sh zsh/.local/bin/zsh-plugin-sync
          PATH="$shellcheck_path/bin:$PATH" "$actionlint_path/bin/actionlint" .github/workflows/check.yml
