name: Check system setup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the native Home Manager generation
        shell: bash
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake check --no-update-lock-file "path:$PWD"
          system=$(nix --extra-experimental-features 'nix-command flakes' eval --raw --impure --expr builtins.currentSystem)
          activation=$(nix --extra-experimental-features 'nix-command flakes' build --no-update-lock-file --no-link --print-out-paths "path:$PWD#checks.$system.activation")
          for managed in \
            .zshenv .zshrc .tmux.conf .config/nvim/init.lua .config/starship.toml \
            .config/nix/nix.conf .local/bin/clipboard-copy \
            .config/atuin/config.toml .config/direnv/lib/hm-nix-direnv.sh \
            .local/share/zsh/plugins/fzf-tab \
            .local/share/zsh/plugins/zsh-completions \
            .local/share/zsh/plugins/zsh-syntax-highlighting \
            .local/share/nvim/site/pack/hm; do
            if [[ ! -L "$activation/home-files/$managed" ]]; then
              printf 'Missing Home Manager link: %s\n' "$managed" >&2
              exit 1
            fi
          done
          test -x "$activation/home-files/.local/bin/clipboard-copy"
          test_home=$(mktemp -d)
          mkdir -p "$test_home/.local/share/zsh" "$test_home/.config/atuin"
          ln -s "$activation/home-path" "$test_home/.nix-profile"
          ln -s "$activation/home-files/.zshenv" "$test_home/.zshenv"
          ln -s "$activation/home-files/.zshrc" "$test_home/.zshrc"
          ln -s "$activation/home-files/.local/share/zsh/plugins" "$test_home/.local/share/zsh/plugins"
          ln -s "$activation/home-files/.config/atuin/config.toml" "$test_home/.config/atuin/config.toml"
          HOME="$test_home" PATH=/usr/bin:/bin "$activation/home-path/bin/zsh" -c '
            command -v nvim >/dev/null && command -v mise >/dev/null && command -v tmux >/dev/null
          '
          HOME="$test_home" PATH="$activation/home-path/bin:$PATH" TERM=dumb zsh -ic '
            bindkey -M vicmd k | grep -q up-line-or-history &&
            bindkey -M vicmd / | grep -q vi-history-search-backward &&
            bindkey -M vicmd "?" | grep -q vi-history-search-forward &&
            bindkey -M viins "^R" | grep -q atuin-search-viins &&
            bindkey -M vicmd "^R" | grep -q atuin-search-vicmd &&
            bindkey -M viins "^[[A" | grep -q atuin-up-search-viins &&
            bindkey -M vicmd "^[[A" | grep -q atuin-up-search-vicmd
          '
          HOME="$test_home" PATH="$activation/home-path/bin:$PATH" TERM=xterm-256color zsh -ic '
            [[ ${widgets[zle-keymap-select]} == user:starship_zle-keymap-select-wrapped ]]
          '
          printf '%s\n' "$activation/home-path/bin" >> "$GITHUB_PATH"
          printf 'NVIM_TEST_DATA_HOME=%s\n' "$activation/home-files/.local/share" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/system-direnv/lib"
          ln -s "$activation/home-files/.config/direnv/lib/hm-nix-direnv.sh" "$RUNNER_TEMP/system-direnv/lib/hm-nix-direnv.sh"
          printf 'DIRENV_CONFIG=%s\n' "$RUNNER_TEMP/system-direnv" >> "$GITHUB_ENV"
      - name: Check scripts and bindings
        shell: bash
        run: |
          bash -n bootstrap/*.sh tests/*.sh clipboard/clipboard-copy
          nvim --version | sed -n '1p' | grep -q '^NVIM'
          vim --version | sed -n '1p' | grep -q '^NVIM'
          atuin --version
          sesh --version
          python3 --version
          mise --version | grep -q '^2026\.9\.12 '
          mise trust mise.toml
          mise tasks ls
          direnv version
          mise run lint
          mise run test
          if [[ "$RUNNER_OS" == macOS ]]; then
            XDG_DATA_HOME="$NVIM_TEST_DATA_HOME" nvim --headless -u "$PWD/nvim/init.lua" \
              "+lua assert(vim.o.clipboard:find('unnamedplus'), 'macOS clipboard provider is inactive')" +qa
          fi
          TERM=xterm-256color STARSHIP_CONFIG="$PWD/starship/.config/starship.toml" starship prompt >/dev/null
          tmux -L system-ci -f "$PWD/tmux/.tmux.conf" new-session -d -s smoke
          tmux -L system-ci list-keys -T prefix p | grep -Fq 'sesh picker'
          tmux -L system-ci list-keys -T prefix L | grep -Fq 'switch-client -l'
          tmux -L system-ci show -sv copy-command | grep -Fq 'clipboard-copy'
          tmux -L system-ci list-keys -T copy-mode-vi y | grep -Fq 'copy-pipe-and-cancel'
          tmux -L system-ci kill-server
      - name: Check nix-direnv project shell
        shell: bash
        run: |
          test_dir=$(mktemp -d "$RUNNER_TEMP/system-direnv-project.XXXXXX")
          nixpkgs_source=$(nix --extra-experimental-features 'nix-command flakes' eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.) ; in f.inputs.nixpkgs.outPath')
          cat > "$test_dir/shell.nix" <<EOF
          { pkgs ? import $nixpkgs_source {} }:
          pkgs.mkShell { shellHook = "export SYSTEM_DIRENV_CHECK=ready"; }
          EOF
          printf 'type nix_direnv_version >/dev/null || exit 1\nuse nix\n' > "$test_dir/.envrc"
          cd "$test_dir"
          direnv allow .
          # shellcheck disable=SC2016
          direnv exec . bash -c 'test "$SYSTEM_DIRENV_CHECK" = ready'
      - name: Check nix-direnv flake shell
        shell: bash
        run: |
          test_dir=$(mktemp -d "$RUNNER_TEMP/system-direnv-flake.XXXXXX")
          system=$(nix --extra-experimental-features 'nix-command flakes' eval --raw --impure --expr builtins.currentSystem)
          nixpkgs_source=$(nix --extra-experimental-features 'nix-command flakes' eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.) ; in f.inputs.nixpkgs.outPath')
          cat > "$test_dir/flake.nix" <<EOF
          {
            inputs.nixpkgs.url = "path:$nixpkgs_source";
            outputs = { nixpkgs, ... }: {
              devShells.$system.default = nixpkgs.legacyPackages.$system.mkShellNoCC {
                shellHook = "export SYSTEM_FLAKE_DIRENV_CHECK=ready";
              };
            };
          }
          EOF
          printf 'type nix_direnv_version >/dev/null || exit 1\nuse flake\n' > "$test_dir/.envrc"
          cd "$test_dir"
          direnv allow .
          # shellcheck disable=SC2016
          direnv exec . bash -c 'test "$SYSTEM_FLAKE_DIRENV_CHECK" = ready'
      - name: Evaluate every supported system
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: nix --extra-experimental-features 'nix-command flakes' flake check --no-update-lock-file --all-systems --no-build "path:$PWD"
